name: M8 temporary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Update lint baseline
        run: |
          chmod +x gradlew
          ./gradlew updateLintBaseline --stacktrace

      - name: Baseline through annotations
        if: always()
        run: |
          f=app/lint-baseline.xml
          [ -f "$f" ] || { echo "::error title=No baseline::app/lint-baseline.xml was not written"; exit 1; }
          sha="$(sha256sum "$f" | cut -c1-64)"
          rm -rf baseline-parts
          mkdir baseline-parts
          xz -9e -c "$f" | base64 -w0 | fold -w 3500 > baseline-parts/all
          total=$(( $(wc -l < baseline-parts/all) + 1 ))
          split -l 1 -d -a 2 baseline-parts/all baseline-parts/part.
          n=0
          for p in baseline-parts/part.*; do
            n=$((n + 1))
            echo "::notice title=Lint baseline part ${n}/${total} sha256=${sha} xz+base64::$(cat "$p")"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: ignore

  settings-apply-flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: SettingsApplyTest ten times on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/m8-flake.sh 10

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flake-logs
          path: |
            flake-run-*.txt
            flake-logcat.txt
          if-no-files-found: ignore
