name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build, test, lint
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --continue 2>&1 | tee build.log

      - name: Device tests compile
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --stacktrace --continue 2>&1 | tee build-androidtest.log

      - name: Release build
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --continue 2>&1 | tee build-release.log

      - name: Perf and size numbers
        if: always()
        run: |
          {
            grep -h -o 'TACIT_KEYSTROKE_JVM[^<]*' app/build/test-results/testDebugUnitTest/*.xml | head -2
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] && echo "$(stat -c %s "$f") bytes $(basename "$f")"
            done
          } > numbers.txt
          msg=$(head -c 1500 numbers.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=Perf and size::$msg"

      - name: Benchmark module
        if: always()
        run: |
          set -o pipefail
          ./gradlew :benchmark:assembleBenchmark --stacktrace --continue 2>&1 | tee build-benchmark.log

      - name: Show errors
        if: failure()
        run: |
          for f in build.log build-androidtest.log build-release.log build-benchmark.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -nE '^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Could not|AssertionError|expected|at app\.tacit|Test|> ' "$f" | grep -v 'Task :' | head -60
          done > errors.txt || true
          msg=$(head -c 30000 errors.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::$msg"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build*.log
            app/build/reports/**
            app/build/test-results/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Publish prerelease
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(ls docs/release-notes/*.md | sort -V | tail -1)"
          tag="$(basename "$notes" .md)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag exists"
            exit 0
          fi
          apk="tacit-${tag}-debug.apk"
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease --title "Tacit ${tag}" --notes-file "$notes"

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens and clipboard on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/device-tests.sh app.tacit.SettingsApplyTest,app.tacit.SettingsScreenTest,app.tacit.ClipboardCaptureTest,app.tacit.ClipboardFocusTest,app.tacit.BatteryDisplayTest,app.tacit.QuicklinksTest,app.tacit.SearchScreenTest
