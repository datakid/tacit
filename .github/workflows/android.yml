name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build, test, lint
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --continue 2>&1 | tee build.log

      - name: Device tests compile
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --stacktrace --continue 2>&1 | tee build-androidtest.log

      - name: Release build
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --continue 2>&1 | tee build-release.log

      - name: Release build is repeatable
        if: always()
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$apk" ]; then
            echo "::notice title=Repeatable build::no release APK to compare"
            exit 0
          fi
          cp "$apk" first-release.apk
          ./gradlew assembleRelease --rerun-tasks --stacktrace > build-release-again.log 2>&1 || true
          if cmp -s first-release.apk "$apk"; then
            msg="Two release builds on this runner are byte-identical (sha256 $(sha256sum first-release.apk | cut -c1-16))"
          else
            unzip -v first-release.apk | awk '{print $7, $8}' | sort > entries-first.txt
            unzip -v "$apk" | awk '{print $7, $8}' | sort > entries-second.txt
            msg="Two release builds on this runner DIFFER. Entries that changed:"$'\n'"$(diff entries-first.txt entries-second.txt | head -20)"
          fi
          msg="$msg"$'\n'"$(python3 .github/scripts/apk-fingerprint.py "$apk")"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=Repeatable build::$msg"

      - name: Perf and size numbers
        if: always()
        run: |
          {
            grep -h -o 'TACIT_KEYSTROKE_JVM[^<]*' app/build/test-results/testDebugUnitTest/*.xml | head -2
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] && echo "$(stat -c %s "$f") bytes $(basename "$f")"
            done
          } > numbers.txt
          msg=$(head -c 1500 numbers.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=Perf and size::$msg"

      - name: Benchmark module
        if: always()
        run: |
          set -o pipefail
          ./gradlew :benchmark:assembleBenchmark --stacktrace --continue 2>&1 | tee build-benchmark.log

      - name: Show errors
        if: failure()
        run: |
          for f in build.log build-androidtest.log build-release.log build-benchmark.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -nE '^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Could not|AssertionError|expected|at app\.tacit|Test|> ' "$f" | grep -v 'Task :' | head -60
          done > errors.txt || true
          msg=$(head -c 30000 errors.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::$msg"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build*.log
            app/build/reports/**
            app/build/test-results/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Signing script check (throwaway key, output discarded)
        if: success()
        run: |
          tmp="$(mktemp -d)"
          keytool -genkeypair -keystore "$tmp/throwaway.jks" -storetype PKCS12 -storepass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 2 -dname "CN=throwaway"
          TACIT_KS_PASS=throwaway bash tools/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/throwaway.jks" throwaway "$tmp/check.apk"
          rm -rf "$tmp"

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens and clipboard on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/device-tests.sh app.tacit.SettingsApplyTest,app.tacit.SettingsScreenTest,app.tacit.ClipboardCaptureTest,app.tacit.ClipboardFocusTest,app.tacit.BatteryDisplayTest,app.tacit.QuicklinksTest,app.tacit.QuicklinksV2Test,app.tacit.AliasesTest,app.tacit.SearchScreenTest,app.tacit.ResultAdapterTest,app.tacit.ScreenPaddingTest,app.tacit.ScreenshotTest,app.tacit.ActionsTest,app.tacit.DrawerTest,app.tacit.FirstRunTest

      - name: Publish screenshots
        if: always() && matrix.api == 35 && github.ref == 'refs/heads/beta'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -d tacit-shots ] && [ -n "$(ls tacit-shots)" ] || { echo "no screenshots"; exit 0; }
          cd tacit-shots
          git init -q -b ci-screenshots
          git config user.name "tacit-ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-screenshots
